[package]
name = "sherlock"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sherlock"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
bs58 = { version = "0.5", features = ["check"] }
bech32 = "0.11"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

[profile.release]
opt-level = 3
